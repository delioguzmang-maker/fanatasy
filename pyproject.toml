[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-autopilot"
version = "0.1.0"
description = "Autopilot for Yahoo Fantasy Football: lineup optimizer, game-day inactive swaps, waivers and FAAB bids, matchup and trade analysis. Runs in Google Colab."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
test = ["pytest>=7", "pandas>=1.5"]

[project.scripts]
fantasy-autopilot = "fantasy_autopilot.__main__:main"

[tool.setuptools.packages.find]
include = ["fantasy_autopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
